name: Public data research sweep
on:
  push:
    branches: [codex/public-data-sweep-2026-09-27]
    paths:
      - 'research/public_sweep/**'
      - '.github/workflows/public-data-sweep.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-data-sweep
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install research runtime
        run: python -m pip install -r research/public_sweep/requirements.txt
      - name: Verify accounting and causal timing before download
        run: |
          mkdir -p work/public-sweep/summary
          python -m unittest discover -s research/public_sweep -p 'test_*.py' -v 2>&1 | tee work/public-sweep/summary/test-results.txt
          python -m pip freeze > work/public-sweep/summary/dependency-lock.txt
      - name: Collect sources and run frozen exploratory grid
        run: python research/public_sweep/run_study.py
      - name: Verify application and frozen research remain unchanged
        if: always()
        run: |
          git diff --exit-code
          git status --short
      - name: Retain summarized research only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-data-study-summaries
          path: work/public-sweep/summary/
          retention-days: 90
          if-no-files-found: error
