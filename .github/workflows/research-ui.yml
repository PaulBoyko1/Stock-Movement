name: Research UI checks
on:
  push:
    branches: [codex/research-foundation, main]
    paths:
      - 'research/ui/index.html'
      - 'research/ui/*.py'
      - 'research/ui/*.js'
      - 'research/ui/*.cjs'
      - 'research/ui/*.css'
      - 'research/ui/workbench-view.html'
      - 'research/ui/backtest-data.json'
      - 'research/evidence-catalog.json'
      - 'research/evidence-register.md'
      - '.github/workflows/research-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned browser test runner
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Check interactions and responsive layout
        run: |
          python research/ui/build_catalog.py --check
          python research/ui/build_workbench.py --check
          python -m unittest discover -s research/ui -p 'test_*.py' -v
          node --test research/ui/test_backtest_engine.cjs
          python research/ui/verify_backtest_baseline.py
          python research/ui/verify_ui.py
      - name: Retain screenshots and checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: research-ui-review
          path: work/ui/
          retention-days: 30
          if-no-files-found: error
